services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kolo
      POSTGRES_PASSWORD: kolo
      POSTGRES_DB: kolo_bank
    ports:
      - "5432:5432"
    volumes:
      - kolo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kolo -d kolo_bank"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      # pool_max_conns=20: pgxpool's default is max(4, CPU count). In the
      # METRICS.md k6 runs, 20 connections gave 409-458 req/s on
      # POST /v1/me/transfers against 362-449 with the default.
      DATABASE_URL: "postgres://kolo:kolo@postgres:5432/kolo_bank?sslmode=disable&pool_max_conns=20"
      LOG_LEVEL: "debug"
      KOLO_KEY_ledger-signing: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMA=="
      ADMIN_API_KEY: "dev-admin-key"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kolo_postgres_data:
