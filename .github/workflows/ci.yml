name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kolo
          POSTGRES_PASSWORD: kolo
          POSTGRES_DB: kolo_bank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kolo -d kolo_bank"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go vet
        run: go vet ./...

      - name: go test
        # -p 1: internal/resilience's kill switches and read-only mode are
        # real global singleton state in the one shared test database —
        # see the Makefile's test target for the full rationale.
        run: go test -p 1 ./...
        env:
          DATABASE_URL: postgres://kolo:kolo@localhost:5432/kolo_bank?sslmode=disable

      - name: Build Docker image
        run: docker build -t kolo-bank-server:ci .
